<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>41的工作台</title>
<meta name="theme-color" content="#96A48B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="41工作台">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="application-name" content="41工作台">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="tb-title">✦ 41的工作台</div>
  <div class="tb-right">
    <div class="tb-date" id="tbDate"></div>
    <button class="tb-gear" id="tbGear" title="设置">⚙️</button>
  </div>
</header>

<main class="main" id="main">
  <div class="loading">正在加载数据…</div>
</main>

<!-- 常驻对话指令框 -->
<div class="chatbar">
  <input type="text" id="cmdInput" placeholder="输入指令：新增待办 / 记账 / 打卡 / 保存佳句…" autocomplete="off">
  <button class="chat-send" id="cmdSend">发送</button>
  <button class="chat-help" id="cmdHelp" title="指令帮助">?</button>
</div>

<!-- 底部固定5导航 -->
<nav class="bottom-nav" id="nav">
  <a class="nav-item" data-view="work"><span class="ni-icon">💼</span><span class="ni-label">工作</span></a>
  <a class="nav-item" data-view="ledger"><span class="ni-icon">📒</span><span class="ni-label">记账</span></a>
  <a class="nav-item active nav-todo" data-view="todo"><span class="ni-icon">☑️</span><span class="ni-label">今日待办</span></a>
  <a class="nav-item" data-view="study"><span class="ni-icon">📖</span><span class="ni-label">学习</span></a>
  <a class="nav-item" data-view="life"><span class="ni-icon">🧘</span><span class="ni-label">生活</span></a>
</nav>

<div class="modal-mask" id="modalMask" style="display:none">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast"></div>

<script src="gh.js"></script>
<script src="core.js"></script>
<script src="ai_chat.js"></script>
<script src="view_work.js"></script>
<script src="view_ledger.js"></script>
<script src="view_todo.js"></script>
<script src="view_study.js"></script>
<script src="view_life.js"></script>
<script src="chatbox.js"></script>
<script src="boot.js"></script>
</body>
</html>
